[project]
name = "qa-orchestrator"
version = "0.1.0"
description = "Phase 2+ orchestrator: reads Playwright results.json (the language-neutral seam) and will drive AI test generation, triage, and self-heal."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
